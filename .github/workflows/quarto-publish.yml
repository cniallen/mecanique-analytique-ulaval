name: Quarto Publish

on:
  workflow_dispatch:
  push:
    branches: main

# Permissions pour le déploiement GitHub Pages officiel (via artefact + OIDC)
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install Quiz extension (parmsam/quarto-quiz)
        run: quarto add parmsam/quarto-quiz --no-prompt

      - name: Install Spotlight pointer extension (mcanouil/quarto-revealjs-spotlight)
        run: quarto add mcanouil/quarto-revealjs-spotlight@1.2.2 --no-prompt

      - name: Render project
        run: quarto render

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
